[project]
name = "orca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VishalAdina", email = "adinavishal59@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sse-starlette>=3.4.10",
    "uvicorn>=0.52.4",
]

[project.scripts]
orca = "orca:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
